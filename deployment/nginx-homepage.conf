server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    location = /health { access_log off; default_type text/plain; return 200 'ok\n'; }
    location = /downloads/markdown-editor.html {
        add_header Content-Disposition 'attachment; filename="markdown-editor.html"';
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
