name: Desktop installers
on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-dependency-lock
          path: desktop/package-lock.json
          retention-days: 14
  build:
    needs: lock
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
            platform: win
            name: windows-x64
          - os: macos-15-intel
            arch: x64
            platform: mac
            name: mac-intel-x64
          - os: macos-15
            arch: arm64
            platform: mac
            name: mac-apple-arm64
          - os: ubuntu-24.04
            arch: x64
            platform: linux
            name: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-dependency-lock
          path: desktop
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run bundle
      - name: Prepare Linux test display and runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2t64 libgbm1
      - name: Native application smoke test
        run: npm run smoke
      - name: Build installers
        run: npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Install and launch test
        run: npm run verify
      - name: Upload installers and verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: markdown-editor-${{ matrix.name }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/proof/*
            desktop/package-lock.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload diagnostic evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.name }}
          path: desktop/proof/*
          if-no-files-found: ignore
          retention-days: 7
